name: 每日A股潜力股自动更新

on:
  schedule:
    # 北京时间 15:35 自动触发（UTC 07:35）
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装依赖库
        run: |
          pip install requests

      - - name: 4. 运行选股与回测脚本
        env:
          # 如需开启手机消息推送，可在仓库 Settings -> Secrets 中设置 NOTIFY_WEBHOOK 或 PUSHPLUS_TOKEN
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python fetch_stocks.py

      - name: 5. 自动提交并保存历史记录
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data.json history/
          git diff --quiet && git diff --staged --quiet || git commit -m "自动更新每日潜力股与历史战绩"
          git push
