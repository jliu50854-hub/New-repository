name: 每日A股潜力股自动更新

on:
  schedule:
    # UTC时间 07:30 对应北京时间 15:30（周一至周五收盘后自动运行）
    - cron: '30 7 * * 1-5'
  workflow_dispatch: # 允许你在网页上手动点击按钮立即运行

permissions:
  contents: write

jobs:
  update-stocks:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安装行情数据依赖库
        run: |
          pip install akshare pandas

      - name: 4. 运行选股脚本生成最新 data.json
        run: |
          python fetch_stocks.py

      - name: 5. 自动提交更新到仓库
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add data.json
          git diff --quiet && git diff --staged --quiet || git commit -m "自动更新每日A股潜力股数据"
          git push
