<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股全市场实时行情与潜力雷达</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .up { color: #dc2626; font-weight: 600; }
        .down { color: #16a34a; font-weight: 600; }
        .star-active { color: #eab308; }
        .sort-btn:hover { cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- 顶部导航 -->
    <header class="bg-slate-900 text-white shadow sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🌐</span>
                <h1 class="text-lg md:text-xl font-bold tracking-tight">A股全市场行情与潜力雷达</h1>
            </div>
            <div class="flex items-center space-x-3 text-xs md:text-sm">
                <span id="market-stat" class="bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">正在同步全市场行情...</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 flex-1 space-y-6">

        <!-- 1. 顶部大盘与情绪统计 -->
        <section class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <div class="md:col-span-2 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">三大指数</h2>
                <div id="index-cards" class="grid grid-cols-3 gap-2 text-center text-sm">
                    <div class="p-2 bg-slate-50 rounded">上证指数: --</div>
                    <div class="p-2 bg-slate-50 rounded">深证成指: --</div>
                    <div class="p-2 bg-slate-50 rounded">创业板指: --</div>
                </div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">市场涨跌分布</h2>
                <div class="flex items-center justify-between mt-2">
                    <div class="text-red-600 font-bold text-lg" id="stat-up">上涨: --</div>
                    <div class="text-green-600 font-bold text-lg" id="stat-down">下跌: --</div>
                    <div class="text-rose-700 font-bold text-xs bg-red-50 px-2 py-1 rounded" id="stat-limit">涨停: --</div>
                </div>
                <div class="text-[11px] text-slate-400 mt-2">覆盖全市场主板、科创板、创业板、北交所</div>
            </div>

            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">我的自选</h2>
                <div class="flex items-center justify-between mt-2">
                    <span class="text-3xl font-extrabold text-amber-500" id="fav-count">0</span>
                    <button onclick="setFilter('fav')" class="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1.5 rounded-lg hover:bg-amber-100">查看自选股</button>
                </div>
                <div class="text-[11px] text-slate-400 mt-2">浏览器本地储存，不丢失</div>
            </div>
        </section>

        <!-- 2. 筛选、搜索与分页控制栏 -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-2 text-sm">
                <button onclick="setFilter('all')" class="filter-btn px-3 py-1.5 rounded-lg bg-blue-600 text-white font-medium" data-type="all">全部A股 (5000+)</button>
                <button onclick="setFilter('量价突破')" class="filter-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium" data-type="量价突破">🔥 量价突破</button>
                <button onclick="setFilter('温和蓄势')" class="filter-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium" data-type="温和蓄势">🌱 温和蓄势</button>
                <button onclick="setFilter('高换手博弈')" class="filter-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium" data-type="高换手博弈">⚡ 高换手博弈</button>
            </div>
            
            <div class="flex items-center space-x-3">
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="搜索代码或名称（如 600519 / 茅台）..." class="w-64 border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <select id="page-size" onchange="changePageSize()" class="border border-slate-300 rounded-lg px-2 py-1.5 text-sm text-slate-600">
                    <option value="20">每页 20 条</option>
                    <option value="50" selected>每页 50 条</option>
                    <option value="100">每页 100 条</option>
                </select>
            </div>
        </section>

        <!-- 3. 表格列表 -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs select-none">
                            <th class="p-3 text-center">自选</th>
                            <th class="p-3">代码 / 名称</th>
                            <th class="p-3 sort-btn" onclick="sortTable('price')">最新价 ⇕</th>
                            <th class="p-3 sort-btn" onclick="sortTable('change_num')">涨跌幅 ⇕</th>
                            <th class="p-3 sort-btn" onclick="sortTable('turnover_num')">换手率 ⇕</th>
                            <th class="p-3 sort-btn" onclick="sortTable('volume_ratio_num')">量比 ⇕</th>
                            <th class="p-3 sort-btn" onclick="sortTable('market_cap_num')">总市值 ⇕</th>
                            <th class="p-3">市盈率 (PE)</th>
                            <th class="p-3">分类标签 / 逻辑</th>
                            <th class="p-3 text-center">走势图</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="10" class="p-8 text-center text-slate-400">正在载入全量行情...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- 分页条 -->
            <div class="bg-slate-50 px-4 py-3 border-t border-slate-200 flex flex-wrap justify-between items-center text-sm text-slate-500 gap-2">
                <div id="page-info">共 0 条数据</div>
                <div class="flex space-x-1" id="pagination-controls">
                    <!-- 分页按钮 -->
                </div>
            </div>
        </section>
    </main>

    <!-- 图表预览弹窗 -->
    <div id="chart-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4" onclick="toggleModal(false)">
        <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl relative" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h3 id="modal-title" class="text-lg font-bold text-slate-800">股票图表</h3>
                    <p class="text-xs text-slate-400">点击下方按钮可切换分时图与日K线</p>
                </div>
                <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
            </div>
            
            <div class="flex space-x-2 mb-4 border-b pb-2">
                <button id="btn-min" onclick="switchChartType('min')" class="text-xs px-3 py-1 bg-blue-600 text-white rounded font-medium">分时图</button>
                <button id="btn-daily" onclick="switchChartType('daily')" class="text-xs px-3 py-1 bg-slate-100 text-slate-600 rounded font-medium">日K线</button>
            </div>

            <div class="flex justify-center items-center bg-slate-50 rounded-xl p-2 min-h-[260px]">
                <img id="chart-img" src="" alt="股票走势图" class="max-w-full rounded shadow-sm">
            </div>
        </div>
    </div>

    <script>
        let allStocks = [];
        let filteredStocks = [];
        let currentPage = 1;
        let pageSize = 50;
        let currentFilter = 'all';
        let sortKey = 'change_num';
        let sortAsc = false;
        let favorites = JSON.parse(localStorage.getItem('my_stock_favs') || '[]');
        let currentSymbol = '';
        let currentChartType = 'min';

        async function loadData() {
            try {
                const res = await fetch('./data.json?t=' + Date.now());
                const data = await res.json();
                
                document.getElementById('market-stat').innerText = `已载入 ${data.total_count || data.stocks.length} 只股票 | 更新于: ${data.update_time}`;
                allStocks = data.stocks || [];

                if (data.market_overview) {
                    renderOverview(data.market_overview);
                }

                updateFavCount();
                applyFilterAndSort();
            } catch (err) {
                document.getElementById('stock-table-body').innerHTML = 
                    '<tr><td colspan="10" class="p-8 text-center text-rose-500 font-medium">未能读取到 data.json，请在 GitHub Actions 运行更新任务。</td></tr>';
            }
        }

        function renderOverview(overview) {
            if (overview.indices) {
                document.getElementById('index-cards').innerHTML = overview.indices.map(idx => {
                    const isUp = idx.change_num >= 0;
                    return `
                        <div class="p-2 rounded border ${isUp ? 'bg-red-50/50 border-red-100' : 'bg-emerald-50/50 border-emerald-100'}">
                            <div class="text-xs font-semibold text-slate-600">${idx.name}</div>
                            <div class="text-sm font-bold ${isUp ? 'up' : 'down'}">${idx.price}</div>
                            <div class="text-xs ${isUp ? 'up' : 'down'}">${idx.change}</div>
                        </div>
                    `;
                }).join('');
            }
            if (overview.up_count !== undefined) {
                document.getElementById('stat-up').innerText = `上涨: ${overview.up_count}`;
                document.getElementById('stat-down').innerText = `下跌: ${overview.down_count}`;
                document.getElementById('stat-limit').innerText = `涨停: ${overview.limit_up}`;
            }
        }

        function applyFilterAndSort() {
            let list = [...allStocks];

            // 1. 标签筛选
            if (currentFilter === 'fav') {
                list = list.filter(s => favorites.includes(s.code));
            } else if (currentFilter !== 'all') {
                list = list.filter(s => s.tag === currentFilter);
            }

            // 2. 搜索
            const q = document.getElementById('search-input').value.trim().toLowerCase();
            if (q) {
                list = list.filter(s => s.code.toLowerCase().includes(q) || s.name.toLowerCase().includes(q));
            }

            // 3. 排序
            if (sortKey) {
                list.sort((a, b) => {
                    let vA = parseFloat(a[sortKey]) || 0;
                    let vB = parseFloat(b[sortKey]) || 0;
                    return sortAsc ? vA - vB : vB - vA;
                });
            }

            filteredStocks = list;
            currentPage = 1;
            renderPage();
        }

        function renderPage() {
            const tbody = document.getElementById('stock-table-body');
            tbody.innerHTML = '';

            const total = filteredStocks.length;
            const totalPages = Math.ceil(total / pageSize) || 1;
            if (currentPage > totalPages) currentPage = totalPages;

            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = filteredStocks.slice(start, end);

            document.getElementById('page-info').innerText = `显示第 ${total === 0 ? 0 : start + 1} 至 ${Math.min(end, total)} 条，共 ${total} 条`;

            if (pageData.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="p-8 text-center text-slate-400">未找到符合条件的股票</td></tr>';
                renderPagination(0, 1);
                return;
            }

            pageData.forEach(s => {
                const isFav = favorites.includes(s.code);
                const isUp = s.change_num >= 0;
                const emLink = `https://quote.eastmoney.com/${s.symbol}.html`;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition border-b border-slate-100';
                tr.innerHTML = `
                    <td class="p-3 text-center">
                        <button onclick="toggleFav('${s.code}')" class="text-base select-none ${isFav ? 'star-active' : 'text-slate-300 hover:text-amber-400'}">★</button>
                    </td>
                    <td class="p-3">
                        <a href="${emLink}" target="_blank" class="font-bold text-slate-800 hover:text-blue-600">${s.name}</a>
                        <span class="text-xs font-mono text-slate-400 ml-1">${s.code}</span>
                    </td>
                    <td class="p-3 font-mono ${isUp ? 'up' : 'down'}">${s.price}</td>
                    <td class="p-3 font-mono ${isUp ? 'up' : 'down'}">${s.change}</td>
                    <td class="p-3 font-mono">${s.turnover}</td>
                    <td class="p-3 font-mono">${s.volume_ratio}</td>
                    <td class="p-3 font-mono text-slate-600">${s.market_cap}</td>
                    <td class="p-3 font-mono text-slate-600">${s.pe}</td>
                    <td class="p-3">
                        ${s.tag !== '全市场' ? `<span class="bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded text-xs font-semibold mr-1">${s.tag}</span>` : ''}
                        <span class="text-xs text-slate-400">${s.reason}</span>
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="openChart('${s.symbol}', '${s.name} (${s.code})')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded border border-slate-200">看图</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            renderPagination(totalPages, currentPage);
        }

        function renderPagination(totalPages, page) {
            const container = document.getElementById('pagination-controls');
            container.innerHTML = '';
            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.innerText = '上一页';
            prevBtn.disabled = page === 1;
            prevBtn.className = `px-2 py-1 rounded text-xs border ${page === 1 ? 'text-slate-300 border-slate-200' : 'bg-white hover:bg-slate-100 border-slate-300'}`;
            prevBtn.onclick = () => { currentPage--; renderPage(); };
            container.appendChild(prevBtn);

            const currText = document.createElement('span');
            currText.className = 'px-2 py-1 text-xs text-slate-600';
            currText.innerText = `${page} / ${totalPages}`;
            container.appendChild(currText);

            const nextBtn = document.createElement('button');
            nextBtn.innerText = '下一页';
            nextBtn.disabled = page === totalPages;
            nextBtn.className = `px-2 py-1 rounded text-xs border ${page === totalPages ? 'text-slate-300 border-slate-200' : 'bg-white hover:bg-slate-100 border-slate-300'}`;
            nextBtn.onclick = () => { currentPage++; renderPage(); };
            container.appendChild(nextBtn);
        }

        function setFilter(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.getAttribute('data-type') === type) {
                    btn.className = 'filter-btn px-3 py-1.5 rounded-lg bg-blue-600 text-white font-medium';
                } else {
                    btn.className = 'filter-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium';
                }
            });
            applyFilterAndSort();
        }

        function handleSearch() {
            applyFilterAndSort();
        }

        function changePageSize() {
            pageSize = parseInt(document.getElementById('page-size').value, 10);
            currentPage = 1;
            renderPage();
        }

        function sortTable(key) {
            if (sortKey === key) {
                sortAsc = !sortAsc;
            } else {
                sortKey = key;
                sortAsc = false;
            }
            applyFilterAndSort();
        }

        function toggleFav(code) {
            if (favorites.includes(code)) {
                favorites = favorites.filter(c => c !== code);
            } else {
                favorites.push(code);
            }
            localStorage.setItem('my_stock_favs', JSON.stringify(favorites));
            updateFavCount();
            renderPage();
        }

        function updateFavCount() {
            document.getElementById('fav-count').innerText = favorites.length;
        }

        function openChart(symbol, title) {
            currentSymbol = symbol;
            document.getElementById('modal-title').innerText = title;
            currentChartType = 'min';
            updateChart();
            toggleModal(true);
        }

        function toggleModal(show) {
            document.getElementById('chart-modal').className = show ? 'fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4' : 'hidden';
        }

        function switchChartType(type) {
            currentChartType = type;
            document.getElementById('btn-min').className = type === 'min' ? 'text-xs px-3 py-1 bg-blue-600 text-white rounded font-medium' : 'text-xs px-3 py-1 bg-slate-100 text-slate-600 rounded font-medium';
            document.getElementById('btn-daily').className = type === 'daily' ? 'text-xs px-3 py-1 bg-blue-600 text-white rounded font-medium' : 'text-xs px-3 py-1 bg-slate-100 text-slate-600 rounded font-medium';
            updateChart();
        }

        function updateChart() {
            const mode = currentChartType === 'min' ? 'min' : 'daily';
            document.getElementById('chart-img').src = `https://image.sinajs.cn/newchart/${mode}/n/${currentSymbol}.gif?t=${Date.now()}`;
        }

        loadData();
    </script>
</body>
</html>
