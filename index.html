<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A股每日潜力股雷达 & 战绩看板</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .up { color: #dc2626; font-weight: 600; }
        .down { color: #16a34a; font-weight: 600; }
        .star-active { color: #eab308; }
        .sort-btn:hover { cursor: pointer; text-decoration: underline; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- 顶部导航 -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-40">
        <div class="container mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">⚡</span>
                <h1 class="text-lg md:text-xl font-bold tracking-tight">A股每日潜力雷达 & 实战复盘</h1>
            </div>
            <div class="flex items-center space-x-3 text-xs md:text-sm">
                <span id="update-time" class="bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">正在同步数据...</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-6 flex-1 space-y-6">

        <!-- 1. 大盘情绪与回测战绩看板 -->
        <section class="grid grid-cols-1 md:grid-cols-4 gap-4">
            <!-- 大盘指数卡片 -->
            <div class="md:col-span-2 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">三大指数概况</h2>
                <div id="index-cards" class="grid grid-cols-3 gap-2 text-center">
                    <div class="p-2 bg-slate-50 rounded-lg">上证指数: --</div>
                    <div class="p-2 bg-slate-50 rounded-lg">深证成指: --</div>
                    <div class="p-2 bg-slate-50 rounded-lg">创业板指: --</div>
                </div>
            </div>

            <!-- 昨日选股胜率追踪 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">昨日选股次日表现</h2>
                <div class="flex items-baseline justify-between mt-2">
                    <div>
                        <div class="text-xs text-slate-400" id="perf-date">追踪日期: --</div>
                        <div class="text-2xl font-bold text-indigo-600" id="perf-winrate">--</div>
                    </div>
                    <div class="text-right">
                        <div class="text-xs text-slate-400">平均次日涨幅</div>
                        <div class="text-lg font-bold" id="perf-avg">--</div>
                    </div>
                </div>
                <div class="text-[11px] text-slate-400 mt-2">基于上一期入选标的在今日收盘的真实溢价统计</div>
            </div>

            <!-- 自选收藏夹统计 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col justify-between">
                <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">我的自选池</h2>
                <div class="flex items-center justify-between mt-2">
                    <span class="text-3xl font-extrabold text-amber-500" id="fav-count">0</span>
                    <button onclick="filterStocks('fav')" class="text-xs bg-amber-50 text-amber-700 border border-amber-200 px-3 py-1.5 rounded-lg hover:bg-amber-100 transition">只看板内自选</button>
                </div>
                <div class="text-[11px] text-slate-400 mt-2">标星自选保存在本地浏览器中，随时对照</div>
            </div>
        </section>

        <!-- 2. 操作筛选栏 -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex flex-wrap gap-2 text-sm">
                <button onclick="filterStocks('all')" class="filter-btn active-btn px-3 py-1.5 rounded-lg bg-blue-600 text-white font-medium shadow-sm">全部标的</button>
                <button onclick="filterStocks('量价突破')" class="filter-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium">量价突破</button>
                <button onclick="filterStocks('温和蓄势')" class="filter-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium">温和蓄势</button>
                <button onclick="filterStocks('高换手博弈')" class="filter-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium">高换手博弈</button>
            </div>
            <div class="flex items-center space-x-2">
                <input type="text" id="search-input" onkeyup="searchStock()" placeholder="搜索代码、简称..." class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>
        </section>

        <!-- 3. 股票行情与分析列表 -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs select-none">
                            <th class="p-3 text-center">自选</th>
                            <th class="p-3">代码 / 名称</th>
                            <th class="p-3 sort-btn" onclick="sortTable('price')">最新价 ⇕</th>
                            <th class="p-3 sort-btn" onclick="sortTable('change_num')">涨跌幅 ⇕</th>
                            <th class="p-3 sort-btn" onclick="sortTable('turnover_num')">换手率 ⇕</th>
                            <th class="p-3 sort-btn" onclick="sortTable('volume_ratio_num')">量比 ⇕</th>
                            <th class="p-3 sort-btn" onclick="sortTable('market_cap_num')">总市值 ⇕</th>
                            <th class="p-3">市盈率 (PE)</th>
                            <th class="p-3">策略标签 / 选拔逻辑</th>
                            <th class="p-3 text-center">图表</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body" class="divide-y divide-slate-100">
                        <tr><td colspan="10" class="p-8 text-center text-slate-400">正在获取数据，请稍候...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <!-- 弹窗：K线图与分时图预览 Modal -->
    <div id="chart-modal" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50 p-4" onclick="closeChartModal(event)">
        <div class="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl relative" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h3 id="modal-title" class="text-lg font-bold text-slate-800">股票图表</h3>
                    <p id="modal-subtitle" class="text-xs text-slate-400">点击标签切换分时/日K</p>
                </div>
                <button onclick="toggleModal(false)" class="text-slate-400 hover:text-slate-700 text-xl font-bold">&times;</button>
            </div>
            
            <div class="flex space-x-2 mb-4 border-b pb-2">
                <button id="btn-min" onclick="switchChartType('min')" class="text-xs px-3 py-1 bg-blue-600 text-white rounded font-medium">分时图</button>
                <button id="btn-daily" onclick="switchChartType('daily')" class="text-xs px-3 py-1 bg-slate-100 text-slate-600 rounded font-medium">日K线</button>
            </div>

            <div class="flex justify-center items-center bg-slate-50 rounded-xl p-2 min-h-[260px]">
                <img id="chart-img" src="" alt="股票走势图" class="max-w-full rounded shadow-sm">
            </div>
        </div>
    </div>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        免责声明：本页面数据及策略仅用于量化技术研究，不构成任何投资买卖建议。投资有风险，入市需谨慎。
    </footer>

    <script>
        let stockData = [];
        let currentFilter = 'all';
        let sortKey = null;
        let sortAsc = false;
        let favorites = JSON.parse(localStorage.getItem('my_stock_favs') || '[]');
        let currentSymbol = '';
        let currentChartType = 'min';

        // 读取每日数据
        async function loadData() {
            try {
                const res = await fetch('./data.json?t=' + Date.now());
                const data = await res.json();
                
                document.getElementById('update-time').innerText = '最后同步: ' + data.update_time;
                stockData = data.stocks || [];
                
                renderMarketOverview(data.market_overview);
                renderPerformance(data.yesterday_performance);
                updateFavCount();
                renderTable(stockData);
            } catch (err) {
                document.getElementById('stock-table-body').innerHTML = 
                    '<tr><td colspan="10" class="p-8 text-center text-rose-500 font-medium">未能读取到数据文件，请确认 GitHub Actions 是否已成功跑完一次任务。</td></tr>';
            }
        }

        // 渲染大盘指数
        function renderMarketOverview(overview) {
            if (!overview || !overview.indices) return;
            const container = document.getElementById('index-cards');
            container.innerHTML = overview.indices.map(idx => {
                const isUp = idx.change_num >= 0;
                return `
                    <div class="p-2.5 rounded-lg border ${isUp ? 'bg-red-50/50 border-red-100' : 'bg-emerald-50/50 border-emerald-100'}">
                        <div class="text-xs font-semibold text-slate-600">${idx.name}</div>
                        <div class="text-sm font-bold ${isUp ? 'up' : 'down'}">${idx.price}</div>
                        <div class="text-xs ${isUp ? 'up' : 'down'}">${idx.change}</div>
                    </div>
                `;
            }).join('');
        }

        // 渲染战绩统计
        function renderPerformance(perf) {
            if (!perf || !perf.tracked_date) return;
            document.getElementById('perf-date').innerText = '对比基准: ' + perf.tracked_date;
            document.getElementById('perf-winrate').innerText = perf.win_rate;
            const avgElem = document.getElementById('perf-avg');
            avgElem.innerText = perf.avg_change;
            if (perf.avg_change.includes('+')) {
                avgElem.className = 'text-lg font-bold up';
            } else if (perf.avg_change.includes('-')) {
                avgElem.className = 'text-lg font-bold down';
            }
        }

        // 渲染表格
        function renderTable(data) {
            const tbody = document.getElementById('stock-table-body');
            tbody.innerHTML = '';

            let list = [...data];

            // 过滤
            if (currentFilter === 'fav') {
                list = list.filter(s => favorites.includes(s.code));
            } else if (currentFilter !== 'all') {
                list = list.filter(s => s.tag === currentFilter);
            }

            // 搜索
            const q = document.getElementById('search-input').value.trim().toLowerCase();
            if (q) {
                list = list.filter(s => s.code.toLowerCase().includes(q) || s.name.toLowerCase().includes(q));
            }

            // 排序
            if (sortKey) {
                list.sort((a, b) => {
                    let vA = parseFloat(a[sortKey]) || 0;
                    let vB = parseFloat(b[sortKey]) || 0;
                    return sortAsc ? vA - vB : vB - vA;
                });
            }

            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" class="p-8 text-center text-slate-400">未找到符合条件的股票</td></tr>';
                return;
            }

            list.forEach(s => {
                const isFav = favorites.includes(s.code);
                const isUp = s.change_num >= 0;
                const emLink = `https://quote.eastmoney.com/${s.symbol}.html`;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50 transition border-b border-slate-100';
                tr.innerHTML = `
                    <td class="p-3 text-center">
                        <button onclick="toggleFav('${s.code}')" class="text-base select-none ${isFav ? 'star-active' : 'text-slate-300 hover:text-amber-400'}">
                            ★
                        </button>
                    </td>
                    <td class="p-3">
                        <a href="${emLink}" target="_blank" class="font-bold text-slate-800 hover:text-blue-600">${s.name}</a>
                        <div class="text-xs font-mono text-slate-400">${s.code}</div>
                    </td>
                    <td class="p-3 font-mono ${isUp ? 'up' : 'down'}">${s.price}</td>
                    <td class="p-3 font-mono ${isUp ? 'up' : 'down'}">${s.change}</td>
                    <td class="p-3 font-mono">${s.turnover}</td>
                    <td class="p-3 font-mono font-medium">${s.volume_ratio}</td>
                    <td class="p-3 font-mono text-slate-600">${s.market_cap}</td>
                    <td class="p-3 font-mono text-slate-600">${s.pe}</td>
                    <td class="p-3">
                        <span class="inline-block bg-blue-50 text-blue-700 border border-blue-200 px-2 py-0.5 rounded text-xs font-semibold mr-1.5">${s.tag}</span>
                        <span class="text-xs text-slate-500">${s.reason}</span>
                    </td>
                    <td class="p-3 text-center">
                        <button onclick="openChartModal('${s.symbol}', '${s.name} (${s.code})')" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-2 py-1 rounded border border-slate-200">
                            趋势
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // 自选收藏
        function toggleFav(code) {
            if (favorites.includes(code)) {
                favorites = favorites.filter(c => c !== code);
            } else {
                favorites.push(code);
            }
            localStorage.setItem('my_stock_favs', JSON.stringify(favorites));
            updateFavCount();
            renderTable(stockData);
        }

        function updateFavCount() {
            document.getElementById('fav-count').innerText = favorites.length;
        }

        // 筛选与排序
        function filterStocks(type) {
            currentFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.className = 'filter-btn px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 hover:bg-slate-200 font-medium';
            });
            event.target.className = 'filter-btn px-3 py-1.5 rounded-lg bg-blue-600 text-white font-medium shadow-sm';
            renderTable(stockData);
        }

        function searchStock() {
            renderTable(stockData);
        }

        function sortTable(key) {
            if (sortKey === key) {
                sortAsc = !sortAsc;
            } else {
                sortKey = key;
                sortAsc = false;
            }
            renderTable(stockData);
        }

        // 图表弹窗逻辑
        function openChartModal(symbol, title) {
            currentSymbol = symbol;
            document.getElementById('modal-title').innerText = title;
            currentChartType = 'min';
            updateChartImage();
            toggleModal(true);
        }

        function closeChartModal(e) {
            toggleModal(false);
        }

        function toggleModal(show) {
            const m = document.getElementById('chart-modal');
            m.className = show ? 'fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4' : 'hidden';
        }

        function switchChartType(type) {
            currentChartType = type;
            const btnMin = document.getElementById('btn-min');
            const btnDaily = document.getElementById('btn-daily');
            if (type === 'min') {
                btnMin.className = 'text-xs px-3 py-1 bg-blue-600 text-white rounded font-medium';
                btnDaily.className = 'text-xs px-3 py-1 bg-slate-100 text-slate-600 rounded font-medium';
            } else {
                btnDaily.className = 'text-xs px-3 py-1 bg-blue-600 text-white rounded font-medium';
                btnMin.className = 'text-xs px-3 py-1 bg-slate-100 text-slate-600 rounded font-medium';
            }
            updateChartImage();
        }

        function updateChartImage() {
            const img = document.getElementById('chart-img');
            const mode = currentChartType === 'min' ? 'min' : 'daily';
            // 使用新浪行情图片免鉴权接口
            img.src = `https://image.sinajs.cn/newchart/${mode}/n/${currentSymbol}.gif?t=${Date.now()}`;
        }

        loadData();
    </script>
</body>
</html>
